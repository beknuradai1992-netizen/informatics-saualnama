<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Биология тесті</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf7ee;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #0002;
}
h1 {
    text-align: center;
    color: #16833b;
}
.subtitle {
    text-align: center;
    color: #555;
}
.question {
    background: #f4faf5;
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
}
label {
    display: block;
    padding: 8px;
    cursor: pointer;
}
button {
    background: #16833b;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 17px;
    width: 100%;
    cursor: pointer;
    margin-top: 15px;
}
button:hover {
    background: #10652c;
}
#result {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
<h1>🧬 Биология тесті</h1>
<p class="subtitle">30 сұрақ · Әр дұрыс жауапқа 1 балл</p>

<form id="quiz"></form>

<button type="button" onclick="checkAnswers()">
Тестті аяқтау
</button>

<button type="button" onclick="location.reload()">
Қайта бастау
</button>

<div id="result"></div>
<div id="details"></div>
</div>

<script>
const questions = [
{
q:"1. Тірі ағзаларды зерттейтін ғылым қалай аталады?",
a:["Физика","Биология","Химия","География"], c:1
},
{
q:"2. Өсімдікке фотосинтез жасау үшін не қажет?",
a:["Тек су","Тек топырақ","Жарық, су және көмірқышқыл газы","Тек оттек"],c:2
},
{
q:"3. Жасушаның басқару орталығы қайсы?",
a:["Ядро","Мембрана","Цитоплазма","Вакуоль"],c:0
},
{
q:"4. Адамның тыныс алу мүшесі?",
a:["Жүрек","Өкпе","Бауыр","Асқазан"],c:1
},
{
q:"5. Қанның қызыл түйіршіктері қалай аталады?",
a:["Лейкоциттер","Тромбоциттер","Эритроциттер","Нейрондар"],c:2
},
{
q:"6. Өсімдік суды негізінен қай мүшесімен сіңіреді?",
a:["Гүлімен","Жапырағымен","Тамырымен","Сабағымен"],c:2
},
{
q:"7. Адамда неше өкпе бар?",
a:["1","2","3","4"],c:1
},
{
q:"8. Адамның жүрегі неше қуысты?",
a:["2","3","4","5"],c:2
},
{
q:"9. Фотосинтез кезінде қандай газ бөлінеді?",
a:["Азот","Оттек","Көмірқышқыл газы","Сутек"],c:1
},
{
q:"10. Адам ағзасындағы ең үлкен мүше?",
a:["Жүрек","Тері","Өкпе","Бүйрек"],c:1
},
{
q:"11. Сүйектер мен бұлшықеттер не үшін қажет?",
a:["Қозғалу үшін","Ас қорыту үшін","Қан жасау ғана үшін","Көру үшін"],c:0
},
{
q:"12. Ас қорыту қай мүшеде басталады?",
a:["Асқазанда","Ауыз қуысында","Аш ішекте","Өңеште"],c:1
},
{
q:"13. Қанның сұйық бөлігі қалай аталады?",
a:["Плазма","Ядро","Лимфа түйіні","Гемоглобин"],c:0
},
{
q:"14. Өсімдік жасушасының қабырғасында не болады?",
a:["Хитин","Целлюлоза","Сүйек","Гемоглобин"],c:1
},
{
q:"15. Жүйке жүйесінің негізгі жасушасы?",
a:["Нейрон","Эритроцит","Остеоцит","Тромбоцит"],c:0
},
{
q:"16. Адам ағзасындағы қанды айдайтын мүше?",
a:["Бауыр","Бүйрек","Жүрек","Өкпе"],c:2
},
{
q:"17. Қай жануар сүтқоректі?",
a:["Бақа","Көгершін","Дельфин","Қолтырауын"],c:2
},
{
q:"18. Балықтар немен тыныс алады?",
a:["Өкпемен ғана","Желбезекпен","Терімен ғана","Трахеямен"],c:1
},
{
q:"19. Қайсысы омыртқалы жануар?",
a:["Жауынқұрт","Өрмекші","Көбелек","Мысық"],c:3
},
{
q:"20. Тұқымның өнуіне не қажет?",
a:["Су, ауа және қолайлы температура","Тек қараңғылық","Тек тыңайтқыш","Тек топырақ"],c:0
},
{
q:"21. Адамның негізгі сезім мүшелерінің бірі?",
a:["Жүрек","Бүйрек","Көз","Асқазан"],c:2
},
{
q:"22. Қай мүше зәр түзеді?",
a:["Бүйрек","Өкпе","Жүрек","Ұйқыбез"],c:0
},
{
q:"23. Қоректік заттардың көп бөлігі қай жерде сіңіріледі?",
a:["Ауызда","Өңеште","Аш ішекте","Кеңірдекте"],c:2
},
{
q:"24. Өсімдіктің көбею мүшесі?",
a:["Тамыр","Гүл","Сабақ","Жапырақ"],c:1
},
{
q:"25. Адам қаңқасының негізгі қызметі?",
a:["Денеге тірек болу және мүшелерді қорғау","Қанды айдау","Асты қорыту","Ауа тазарту"],c:0
},
{
q:"26. Қайсысы омыртқасыз жануар?",
a:["Ит","Бүркіт","Балық","Жауынқұрт"],c:3
},
{
q:"27. Экожүйе дегеніміз не?",
a:["Тек жануарлар тобы","Тірі ағзалар мен олардың ортасының бірлігі","Тек өсімдіктер","Тек су"],c:1
},
{
q:"28. Қай ағза саңырауқұлақтарға жатады?",
a:["Қайың","Қалпақты саңырауқұлақ","Балдыр","Мүк"],c:1
},
{
q:"29. Адам ағзасындағы тұқым қуалайтын ақпараттың негізгі тасымалдаушысы?",
a:["ДНҚ","Су","Оттек","Кальций"],c:0
},
{
q:"30. Қоршаған ортаны қорғау үшін не істеу керек?",
a:["Қоқысты кез келген жерге тастау","Суды ластау","Қоқысты сұрыптап, табиғатты қорғау","Ағаштарды себепсіз кесу"],c:2
}
];

const form = document.getElementById("quiz");

questions.forEach((item, i) => {
    let html = `<div class="question">
    <b>${item.q}</b>`;

    item.a.forEach((answer, j) => {
        html += `<label>
        <input type="radio" name="q${i}" value="${j}">
        ${answer}
        </label>`;
    });

    html += `</div>`;
    form.innerHTML += html;
});

function checkAnswers() {
    let score = 0;
    let unanswered = 0;

    questions.forEach((item, i) => {
        const selected = document.querySelector(
            `input[name="q${i}"]:checked`
        );

        if (!selected) {
            unanswered++;
        } else if (Number(selected.value) === item.c) {
            score++;
        }
    });

    const result = document.getElementById("result");
    const details = document.getElementById("details");

    result.innerHTML = `Нәтиже: ${score}/30`;

    let message = "";

    if (score >= 27) {
        message = "🏆 Өте жақсы!";
    } else if (score >= 20) {
        message = "👏 Жақсы нәтиже!";
    } else if (score >= 15) {
        message = "👍 Жаман емес, тағы дайындал!";
    } else {
        message = "📚 Қайталап оқып, қайта байқап көр!";
    }

    details.innerHTML =
        `<p style="text-align:center">${message}</p>
        <p style="text-align:center">
        Жауап берілмеген сұрақтар: ${unanswered}
        </p>`;

    result.scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
