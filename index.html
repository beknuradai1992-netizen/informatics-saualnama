<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio Shooter</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{padding:12px;background:#172b3d}
h1{color:#5dffb1;margin:5px}
#hud{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:10px}
.stat{background:#263c50;padding:10px 14px;border-radius:10px}
#arena{
 position:relative;height:210px;margin:10px;
 border:3px solid #5dffb1;border-radius:15px;
 overflow:hidden;
 background:linear-gradient(#74d5ff 0%,#b6edff 60%,#4ca64c 60%,#20672c 100%);
}
#sun{position:absolute;right:25px;top:20px;font-size:38px}
#player{position:absolute;bottom:10px;left:15px;font-size:45px}
.target{
 position:absolute;right:25px;top:65px;
 width:85px;height:85px;border-radius:50%;
 background:#ffcf4a;border:5px solid #fff;
 color:#18202b;font-size:32px;font-weight:bold;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 0 15px #fff8;
}
#bullet{
 position:absolute;display:none;font-size:25px;
 left:75px;bottom:35px;z-index:2;
}
#question{font-size:21px;font-weight:bold;padding:12px}
#answers{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;padding:10px;max-width:600px;margin:auto;
}
button{
 border:0;border-radius:12px;padding:16px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.answer{background:#263c50;color:white;border:2px solid #47657e}
.answer:disabled{opacity:1}
.answer.correct{background:#168348;border-color:#62ffad}
.answer.wrong{background:#a82d3b;border-color:#ff8b8b}
#message{min-height:30px;padding:8px;font-weight:bold}
.main{background:#5dffb1;color:#10251b;margin:8px}
.hidden{display:none!important}
#start,#end{padding:25px}
#help{color:#c8d6e5;font-size:14px;padding:10px}
</style>
</head>
<body>

<header>
<h1>🔫 BIO SHOOTER</h1>
<div>Биологиядан атыс ойыны</div>
</header>

<div id="hud">
 <div class="stat">⭐ Ұпай: <span id="score">0</span></div>
 <div class="stat">❤️ Өмір: <span id="lives">❤️❤️❤️</span></div>
 <div class="stat">❓ Сұрақ: <span id="number">0/30</span></div>
</div>

<div id="start">
 <h2>🎮 Ойынға дайынсың ба?</h2>
 <p>Сұрақтарға дұрыс жауап беріп, нысананы ат!</p>
 <p>❤️ 3 өмірің бар. 3 рет қателессең, ойын аяқталады.</p>
 <button class="main" onclick="startGame()">ОЙЫНДЫ БАСТАУ</button>
</div>

<div id="game" class="hidden">
 <div id="arena">
  <div id="sun">☀️</div>
  <div id="player">🧑‍🚀</div>
  <div id="bullet">🔸</div>
  <div class="target" id="target">🎯</div>
 </div>

 <div id="question"></div>
 <div id="answers"></div>
 <div id="message"></div>
 <button id="next" class="main hidden" onclick="nextQuestion()">КЕЛЕСІ СҰРАҚ ➜</button>
 <div id="help">Дұрыс жауапты таңда — нысанаға оқ атылады!</div>
</div>

<div id="end" class="hidden">
 <h2 id="endTitle">Ойын аяқталды!</h2>
 <h1 id="finalScore"></h1>
 <p id="endMessage"></p>
 <button class="main" onclick="startGame()">🔄 ҚАЙТА БАСТАУ</button>
</div>

<script>
const questions=[
["Жасушаның басқару орталығы?",["Ядро","Қабырға","Вакуоль","Мембрана"],0],
["Адам қай мүшемен тыныс алады?",["Жүрек","Өкпе","Бауыр","Бүйрек"],1],
["Қанды айдайтын мүше?",["Асқазан","Ми","Жүрек","Өкпе"],2],
["Өсімдікке фотосинтез үшін не керек?",["Тек топырақ","Тек оттек","Тек су","Жарық, су, көмірқышқыл газы"],3],
["Адамда неше өкпе бар?",["2","1","3","4"],0],
["Қанның қызыл жасушалары?",["Нейрон","Эритроцит","Лейкоцит","Тромбоцит"],1],
["Өсімдік суды қай мүшесімен сіңіреді?",["Гүл","Жапырақ","Тамыр","Жеміс"],2],
["Балықтар немен тыныс алады?",["Өкпе","Тері ғана","Мұрын","Желбезек"],3],
["Адамның ең үлкен мүшесі?",["Тері","Жүрек","Бауыр","Ми"],0],
["Ас қорыту қайдан басталады?",["Асқазан","Ауыз қуысынан","Аш ішек","Өңеш"],1],
["Сүйектердің қызметі?",["Қанды айдау","Асты қорыту","Тірек және қорғаныш","Тыныс алу"],2],
["Қай жануар сүтқоректі?",["Бақа","Кесіртке","Балық","Дельфин"],3],
["Өсімдіктің көбею мүшесі?",["Гүл","Тамыр","Сабақ","Жапырақ"],0],
["Жүйке жүйесінің негізгі жасушасы?",["Эритроцит","Нейрон","Тромбоцит","Лейкоцит"],1],
["Зәр түзетін мүше?",["Өкпе","Жүрек","Бүйрек","Асқазан"],2],
["Қайсысы омыртқасыз?",["Мысық","Балық","Жылан","Жауынқұрт"],3],
["Фотосинтез кезінде қандай газ бөлінеді?",["Оттек","Азот","Сутек","Метан"],0],
["Адам жүрегі неше қуысты?",["2","4","3","5"],1],
["Тұқымның өнуіне не қажет?",["Тек жарық","Тек топырақ","Су, ауа, қолайлы температура","Тек тыңайтқыш"],2],
["Адамның ойлау мүшесі?",["Бауыр","Жүрек","Өкпе","Ми"],3],
["Қайсысы саңырауқұлақ?",["Қалпақты саңырауқұлақ","Қайың","Бидай","Мүк"],0],
["Қоректік заттар негізінен қайда сіңеді?",["Өңеште","Аш ішекте","Ауызда","Кеңірдекте"],1],
["ДНҚ не сақтайды?",["Ауа райын","Дыбысты","Тұқым қуалайтын ақпаратты","Судың температурасын"],2],
["Қай жануар қосмекенді?",["Қасқыр","Бүркіт","Түйе","Бақа"],3],
["Өсімдіктің қай бөлігі фотосинтез жасайды?",["Жапырақ","Тамыр ғана","Гүл ғана","Тұқым ғана"],0],
["Қанның сұйық бөлігі?",["Гемоглобин","Плазма","Ядро","Сүйек"],1],
["Экожүйе дегеніміз?",["Тек жануарлар","Тек су","Тірі ағзалар мен олардың ортасы","Тек өсімдіктер"],2],
["Адамда қанайналым мүшесі?",["Бүйрек","Асқазан","Ми","Жүрек"],3],
["Адамның негізгі сезім мүшелерінің бірі?",["Көз","Бауыр","Өкпе","Жүрек"],0],
["Табиғатты қалай қорғаймыз?",["Қоқыс тастау","Қоқысты сұрыптап, табиғатты қорғау","Суды ластау","Ағаштарды себепсіз кесу"],1]
];

let index=0,score=0,lives=3,locked=false;

function startGame(){
 index=0;score=0;lives=3;locked=false;
 document.getElementById("start").classList.add("hidden");
 document.getElementById("end").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 updateHUD();showQuestion();
}

function updateHUD(){
 document.getElementById("score").textContent=score;
 document.getElementById("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
 document.getElementById("number").textContent=Math.min(index+1,30)+"/30";
}

function showQuestion(){
 locked=false;
 let q=questions[index];
 document.getElementById("question").textContent=q[0];
 document.getElementById("message").textContent="";
 document.getElementById("next").classList.add("hidden");
 document.getElementById("target").textContent="🎯";
 document.getElementById("bullet").style.display="none";
 let box=document.getElementById("answers");
 box.innerHTML="";
 q[1].forEach((a,i)=>{
  let b=document.createElement("button");
  b.className="answer";
  b.textContent=String.fromCharCode(65+i)+". "+a;
  b.onclick=()=>answer(i,b);
  box.appendChild(b);
 });
 updateHUD();
}

function answer(choice,button){
 if(locked)return;
 locked=true;
 let q=questions[index];
 let buttons=document.querySelectorAll(".answer");
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q[2])b.classList.add("correct");
 });
 if(choice===q[2]){
  score++;
  document.getElementById("message").textContent="🎯 ДӘЛ ТИДІ! +1 ұпай!";
  document.getElementById("target").textContent="💥";
  let bullet=document.getElementById("bullet");
  bullet.style.display="block";
  bullet.animate([{left:"75px"},{left:"75%",opacity:0}],{duration:450});
 }else{
  lives--;
  button.classList.add("wrong");
  document.getElementById("message").textContent=
   "❌ Қате! Дұрыс жауап: "+q[1][q[2]];
  document.getElementById("target").textContent="💢";
 }
 updateHUD();
 if(lives<=0){
  document.getElementById("next").textContent="НӘТИЖЕНІ КӨРУ";
  document.getElementById("next").classList.remove("hidden");
  document.getElementById("next").onclick=finishGame;
 }else{
  document.getElementById("next").textContent=
   index===questions.length-1?"НӘТИЖЕНІ КӨРУ":"КЕЛЕСІ СҰРАҚ ➜";
  document.getElementById("next").onclick=nextQuestion;
  document.getElementById("next").classList.remove("hidden");
 }
}

function nextQuestion(){
 if(lives<=0||index===questions.length-1){finishGame();return;}
 index++;showQuestion();
}

function finishGame(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("end").classList.remove("hidden");
 document.getElementById("finalScore").textContent=score+"/30 ұпай";
 if(lives<=0){
  document.getElementById("endTitle").textContent="💔 Өмірің бітті!";
  document.getElementById("endMessage").textContent=
   "3 рет қателестің. Ойынды қайта баста!";
 }else{
  document.getElementById("endTitle").textContent="🏆 Ойын аяқталды!";
  document.getElementById("endMessage").textContent=
   score>=25?"Керемет атқыш! Биологияны жақсы білесің!":"Жарайсың! Тағы бір рет ойнап көр!";
 }
}
</script>
</body>
</html>
